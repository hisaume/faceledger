[project]
name = "faceledger"
version = "0.0.0"
description = "Local face-comparison and vector-cache maintenance"
requires-python = "==3.12.*"
dependencies = [
    "deepface==0.0.100",
    "pillow==12.3.0",
    "tensorflow==2.21.0",
    "tf-keras==2.21.0",
]

[tool.uv]
package = false
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
exclude-newer = "2026-07-24T00:00:00Z"
