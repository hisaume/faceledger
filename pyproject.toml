[project]
name = "faceledger"
version = "0.5.0"
description = "Local face-comparison and vector-cache maintenance"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
dependencies = [
    "deepface==0.0.100",
    "numpy==2.5.1",
    "pillow==12.3.0",
    "tensorflow==2.21.0",
    "tf-keras==2.21.0",
]

[project.scripts]
faceledger = "faceledger.cli:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = true
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
exclude-newer = "2026-07-24T00:00:00Z"

[tool.uv.build-backend]
module-root = ""
module-name = "faceledger"
source-exclude = [".mypy_cache", ".ruff_cache"]

[tool.mypy]
strict = true
show_error_codes = true
pretty = true

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.0",
]
